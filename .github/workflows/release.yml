name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.5.0'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'
      - name: Validate signed release tag
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin main:refs/remotes/origin/main
          ref=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$GITHUB_REF_NAME")
          test "$(jq -r .object.type <<<"$ref")" = tag
          tag=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$(jq -r .object.sha <<<"$ref")")
          test "$(jq -r .verification.verified <<<"$tag")" = true
          test "$(jq -r .object.sha <<<"$tag")" = "$GITHUB_SHA"
          git -c gpg.format=ssh -c gpg.ssh.allowedSignersFile=.github/release-allowed-signers verify-tag "$GITHUB_REF_NAME"
          tagCommit=$(git rev-parse "$GITHUB_REF_NAME^{}")
          test "$tagCommit" = "$GITHUB_SHA"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          packageVersion=$(node -p "require('./package.json').version")
          test "${GITHUB_REF_NAME#v}" = "$packageVersion"
          lockVersion=$(node -p "require('./package-lock.json').version")
          test "$lockVersion" = "$packageVersion"
          pigVersion=$(node -p "require('./pig/package.json').version")
          test "$pigVersion" = "$packageVersion"
        env:
          GH_TOKEN: ${{ github.token }}
      - run: npm ci --ignore-scripts
      # A publish is skipped when its version is already on npm, so a release
      # that failed between the two publishes (or before the GitHub release)
      # can be rerun; npm refuses to publish the same version twice.
      - name: Check npm for the release version
        id: published
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          for package in root=pi-provider-litellm pig=pig-provider-litellm; do
            if npm view "${package#*=}@$version" version >/dev/null 2>&1; then
              echo "${package%%=*}=true" >> "$GITHUB_OUTPUT"
              echo "${package#*=}@$version is already on npm"
            fi
          done
      - name: Publish to npm
        if: steps.published.outputs.root != 'true'
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish PiG package to npm
        if: steps.published.outputs.pig != 'true'
        working-directory: pig
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
