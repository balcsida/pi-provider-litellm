name: LiteLLM Smoke

on:
  workflow_dispatch: {}
  schedule:
    - cron: '23 4 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/litellm-smoke.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/smoke*.ts'
      - 'src/**'
      - 'tests/**'
  pull_request:
    paths:
      - '.github/workflows/litellm-smoke.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'scripts/smoke*.ts'
      - 'src/**'
      - 'tests/**'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LITELLM_BASE_URL: http://127.0.0.1:4000
      LITELLM_API_KEY: sk-ci-litellm-smoke
      LITELLM_MASTER_KEY: sk-ci-litellm-smoke
      LITELLM_LICENSE: ${{ github.event_name != 'pull_request' && secrets.LITELLM_LICENSE || '' }}
      LITELLM_DATABASE_URL: postgresql://litellm:litellm@host.docker.internal:5432/litellm
      LITELLM_IMAGE: ${{ github.event_name != 'pull_request' && secrets.LITELLM_LICENSE != '' && 'docker.litellm.ai/berriai/litellm-database@sha256:8b229a4b48fbe62d7f994b502106c3c1dbab958c07934fb446ac0e048a62745e' || 'docker.litellm.ai/berriai/litellm@sha256:f2dc9ba8a62cf2c51e3ed00e6975f4c70bb577b8ef0c2d7040e3228dc7d42b09' }}
      LITELLM_SMOKE_MODELS: vidaimock-openai anthropic/vidaimock-claude grouped-vidaimock
      LITELLM_SMOKE_EXPECT_SOURCE: model_info
      LITELLM_CLI_SMOKE_MODEL: vidaimock-openai
      LITELLM_CLI_SMOKE_MODEL_ANTHROPIC: anthropic/vidaimock-claude
      VIDAIMOCK_BASE_URL: http://127.0.0.1:8100
      VIDAIMOCK_VERSION: v0.2.7
      VIDAIMOCK_SHA256: 3095dd2794b6bd3623057beb1c7def22ae366b85121acb72b3c92a54f79eb7fe

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.0'
          cache: 'npm'

      - run: npm ci --ignore-scripts

      - name: Install VidaiMock
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tmp/bin
          asset="vidaimock-linux-x64.tar.gz"
          curl -fsSL \
            "https://github.com/vidaiUK/VidaiMock/releases/download/${VIDAIMOCK_VERSION}/${asset}" \
            -o ".tmp/${asset}"
          (cd .tmp && printf '%s  %s\n' "$VIDAIMOCK_SHA256" "$asset" | sha256sum -c -)
          tar -xzf ".tmp/${asset}" -C .tmp
          install -m 0755 .tmp/vidaimock/vidaimock .tmp/bin/vidaimock
          .tmp/bin/vidaimock --version

      - name: Start VidaiMock
        shell: bash
        run: |
          set -euo pipefail

          .tmp/bin/vidaimock --host 0.0.0.0 --port 8100 > .tmp/vidaimock.log 2>&1 &
          echo "$!" > .tmp/vidaimock.pid

      - name: Wait for VidaiMock
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            if curl -fsS --connect-timeout 1 --max-time 3 "$VIDAIMOCK_BASE_URL/v1/models" >/tmp/vidaimock-models.json; then
              cat /tmp/vidaimock-models.json
              exit 0
            fi
            sleep 1
          done
          cat .tmp/vidaimock.log >&2 || true
          exit 1

      - name: Start LiteLLM smoke database
        if: ${{ env.LITELLM_LICENSE != '' }}
        shell: bash
        run: |
          set -euo pipefail

          docker run -d \
            --name litellm-smoke-db \
            -e POSTGRES_USER=litellm \
            -e POSTGRES_PASSWORD=litellm \
            -e POSTGRES_DB=litellm \
            -p 5432:5432 \
            postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6

      - name: Wait for LiteLLM smoke database
        if: ${{ env.LITELLM_LICENSE != '' }}
        shell: bash
        run: |
          set -euo pipefail

          for _ in {1..30}; do
            if docker exec litellm-smoke-db pg_isready -U litellm -d litellm; then
              exit 0
            fi
            sleep 1
          done
          docker logs litellm-smoke-db >&2 || true
          exit 1

      - name: Write LiteLLM smoke config
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p .tmp
          cat > .tmp/litellm_config.yaml <<YAML
          model_list:
            - model_name: vidaimock-openai
              litellm_params:
                model: openai/gpt-4o-mini
                api_base: http://host.docker.internal:8100/v1
                api_key: sk-vidaimock
            - model_name: anthropic/vidaimock-claude
              model_info:
                mode: chat
              litellm_params:
                model: anthropic/claude-3-5-sonnet
                api_base: http://host.docker.internal:8100
                api_key: sk-vidaimock
            - model_name: grouped-vidaimock
              model_info:
                mode: chat
              litellm_params:
                model: openai/gpt-4o-mini
                api_base: http://host.docker.internal:8100/v1
                api_key: sk-vidaimock
            - model_name: grouped-vidaimock
              model_info:
                mode: responses
              litellm_params:
                model: anthropic/claude-3-5-sonnet
                api_base: http://host.docker.internal:8100
                api_key: sk-vidaimock
          general_settings:
            master_key: ${LITELLM_MASTER_KEY}
          YAML
          if [[ -n "${LITELLM_LICENSE:-}" ]]; then
            cat >> .tmp/litellm_config.yaml <<YAML
            database_url: ${LITELLM_DATABASE_URL}
            store_model_in_db: true
            admin_only_routes: ["/key/generate"]
          YAML
          fi

      - name: Start LiteLLM proxy
        shell: bash
        run: |
          set -euo pipefail
          docker run -d \
            --name litellm-smoke \
            --add-host=host.docker.internal:host-gateway \
            -p 4000:4000 \
            -v "$PWD/.tmp/litellm_config.yaml:/app/config.yaml:ro" \
            -e LITELLM_MASTER_KEY \
            -e LITELLM_LICENSE \
            "$LITELLM_IMAGE" \
            --config /app/config.yaml

      - name: Wait for LiteLLM proxy
        shell: bash
        run: |
          set -euo pipefail
          for _ in {1..60}; do
            if curl -fsS --connect-timeout 1 --max-time 3 \
              -H "Authorization: Bearer $LITELLM_API_KEY" \
              "$LITELLM_BASE_URL/v1/models" >/tmp/litellm-models.json; then
              cat /tmp/litellm-models.json
              exit 0
            fi
            sleep 2
          done
          docker logs litellm-smoke >&2 || true
          exit 1

      - name: Verify deployment-group reduction
        shell: bash
        run: |
          set -euo pipefail
          node --import tsx --input-type=module - <<'NODE'
          const assert = (condition, message) => {
            if (!condition) throw new Error(message);
          };
          const response = await fetch(`${process.env.LITELLM_BASE_URL}/model/info`, {
            headers: { Authorization: `Bearer ${process.env.LITELLM_API_KEY}` },
            signal: AbortSignal.timeout(3000),
          });
          assert(response.ok, `/model/info returned ${response.status}`);
          const payload = await response.json();
          assert(Array.isArray(payload.data), "/model/info response has no data array");
          const rows = payload.data.filter((row) => row.model_name === "grouped-vidaimock");
          assert(rows.length === 2, `expected two grouped deployments, received ${rows.length}`);
          const { pathToFileURL } = await import("node:url");
          const { discoverModels, resolveModelInfoCatalog } = await import(pathToFileURL("src/discover.ts").href);
          const costSources = {
            input: "input_cost_per_token",
            output: "output_cost_per_token",
            cacheRead: "cache_read_input_token_cost",
            cacheWrite: "cache_creation_input_token_cost",
          };
          const catalogs = rows.map((row) => resolveModelInfoCatalog(row));
          const catalogProvider = catalogs[0]?.provider;
          const catalogModelId = catalogs[0]?.catalogModelId;
          const hasCatalogAuthority =
            catalogProvider !== undefined &&
            catalogModelId !== undefined &&
            catalogs.every(
              (catalog) => catalog?.provider === catalogProvider && catalog?.catalogModelId === catalogModelId,
            );
          const deploymentCosts = rows.map((row, index) => {
            const catalogCost = hasCatalogAuthority ? catalogs[index]?.cost : undefined;
            return Object.fromEntries(
              Object.entries(costSources).map(([field, source]) => {
                const perToken = row.model_info?.[source];
                const explicit =
                  typeof perToken === "number" && Number.isFinite(perToken) && perToken >= 0
                    ? perToken * 1_000_000
                    : undefined;
                return [field, explicit ?? catalogCost?.[field]];
              }),
            );
          });
          const expectedCost = Object.fromEntries(
            Object.keys(costSources).map((field) => {
              const values = deploymentCosts.map((cost) => cost[field]);
              const complete = values.every((value) => value !== undefined);
              return [field, complete ? Math.max(...values) : 0];
            }),
          );
          const summary = rows
            .map((row, index) => ({ id: row.model_info?.id, mode: row.model_info?.mode, cost: deploymentCosts[index] }))
            .sort((left, right) => String(left.mode).localeCompare(String(right.mode)));
          console.log(JSON.stringify({ deployments: summary, expectedCost }, null, 2));
          for (const row of summary) assert(row.id, "grouped deployment is missing model_info.id");
          assert(
            summary.map((row) => row.mode).join(",") === "chat,responses",
            `expected one chat and one responses deployment, received ${summary.map((row) => row.mode).join(",")}`,
          );
          const result = await discoverModels(process.env.LITELLM_BASE_URL, process.env.LITELLM_API_KEY);
          const grouped = result.models.filter((model) => model.id === "grouped-vidaimock");
          console.log(JSON.stringify(grouped, null, 2));
          assert(grouped.length === 1, `expected one reduced group, received ${grouped.length}`);
          assert(grouped[0].api === "openai-completions", `mixed group must reduce to Chat, received ${grouped[0].api}`);
          assert(
            grouped[0].name === "grouped-vidaimock (incomplete metadata)",
            `withheld-authority group must carry the permanent marker, received ${grouped[0].name}`,
          );
          for (const field of Object.keys(costSources)) {
            assert(
              grouped[0].cost[field] === expectedCost[field],
              `group ${field} cost must equal the maximum complete deployment cost; ` +
                `expected ${expectedCost[field]}, received ${JSON.stringify(grouped[0].cost)} from ` +
                `${JSON.stringify(summary)}`,
            );
          }
          assert(
            grouped[0].thinkingLevelMap === undefined || Object.values(grouped[0].thinkingLevelMap).every((value) => value === null),
            "group must not adopt a catalog thinking-level value",
          );
          NODE

      - name: Run provider smoke
        env:
          LITELLM_SMOKE_TIMEOUT_MS: '60000'
        run: npx tsx scripts/smoke-runner.ts

      - name: Run community auth smoke
        env:
          LITELLM_LICENSE: ''
          LITELLM_SMOKE_TIMEOUT_MS: '60000'
        run: npx tsx scripts/smoke-auth.ts

      - name: Run Enterprise auth smoke
        if: ${{ env.LITELLM_LICENSE != '' }}
        env:
          LITELLM_SMOKE_TIMEOUT_MS: '60000'
        run: npx tsx scripts/smoke-auth.ts

      - name: Initialize shared Pi agent directory
        env:
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-cli-smoke
        run: mkdir -p "$PI_CODING_AGENT_DIR"

      - name: Run interactive Pi terminal smoke
        env:
          LITELLM_DISCOVERY_TIMEOUT_MS: '60000'
          LITELLM_TERMINAL_SMOKE: '1'
          PI_CODING_AGENT_DIR: ${{ runner.temp }}/pi-cli-smoke
        run: npm test -- tests/terminal-smoke.test.ts

      # `--list-models` also reports models Pi has persisted in its own store, so running it
      # against the shared agent dir the terminal smoke already refreshed would pass even if
      # the extension failed to load. Use a dedicated empty agent dir for this leg, and prove
      # the assertion discriminates by first running it with a manifest entrypoint that does
      # not exist -- the loader skips a missing entry silently, so the models must be absent.
      - name: Run Pi CLI smoke
        env:
          LITELLM_DISCOVERY_TIMEOUT_MS: '60000'
        run: |
          set -euo pipefail

          list_models_dir="${{ runner.temp }}/pi-list-models"
          rm -rf "$list_models_dir" && mkdir -p "$list_models_dir"

          cp package.json /tmp/pi-manifest.bak
          node -e 'const f="package.json";const p=require(`./${f}`);p.pi.extensions=["./src/does-not-exist.ts"];require("fs").writeFileSync(f,JSON.stringify(p,null,2))'
          PI_CODING_AGENT_DIR="$list_models_dir" ./node_modules/.bin/pi -e . --list-models litellm 2>&1 | tee /tmp/pi-negative.txt || true
          cp /tmp/pi-manifest.bak package.json
          if grep -qF "vidaimock-openai" /tmp/pi-negative.txt; then
            echo "negative control failed: models listed without a loadable entrypoint" >&2
            exit 1
          fi

          rm -rf "$list_models_dir" && mkdir -p "$list_models_dir"
          PI_CODING_AGENT_DIR="$list_models_dir" ./node_modules/.bin/pi -e . --list-models litellm 2>&1 | tee /tmp/pi-litellm-models.txt
          grep -F "vidaimock-openai" /tmp/pi-litellm-models.txt
          grep -F "anthropic/vidaimock-claude" /tmp/pi-litellm-models.txt
          grep -F "grouped-vidaimock" /tmp/pi-litellm-models.txt

          export PI_CODING_AGENT_DIR="${{ runner.temp }}/pi-cli-smoke"
          ./node_modules/.bin/pi \
            -e . \
            --provider litellm \
            --model "$LITELLM_CLI_SMOKE_MODEL" \
            --no-tools \
            --no-session \
            -p "Reply with one short word." | tee /tmp/pi-litellm-response.txt
          grep -F "mock response" /tmp/pi-litellm-response.txt

          # Anthropic-backed route: covers the cacheControlFormat "anthropic"
          # compat path through LiteLLM's Anthropic translation.
          ./node_modules/.bin/pi \
            -e . \
            --provider litellm \
            --model "$LITELLM_CLI_SMOKE_MODEL_ANTHROPIC" \
            --no-tools \
            --no-session \
            -p "Reply with one short word." | tee /tmp/pi-litellm-response-anthropic.txt
          grep -F "Anthropic mock response" /tmp/pi-litellm-response-anthropic.txt

      - name: Dump LiteLLM logs
        if: failure()
        run: docker logs litellm-smoke || true

      - name: Dump VidaiMock logs
        if: failure()
        run: cat .tmp/vidaimock.log || true

      - name: Stop LiteLLM proxy
        if: always()
        run: docker rm -f litellm-smoke || true

      - name: Stop LiteLLM smoke database
        if: always()
        run: docker rm -f litellm-smoke-db || true

      - name: Stop VidaiMock
        if: always()
        run: |
          if [[ -f .tmp/vidaimock.pid ]]; then
            kill "$(cat .tmp/vidaimock.pid)" 2>/dev/null || true
          fi
